 
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" type="text/css" href="/Dashboard.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">

<body>
    <div class="grid-container">

        <header> <!--Header-->
            <h3>DASHBOARD</h3>
        <div>
            <form class="addForm" id="forms">
                <input type="text" placeholder="Add tasks" id="taskss">
                <input class="butn" type="submit">
            </form>
            <form>
                <input class="butn" type="submit">
                <input type="text" placeholder="Search for tasks">
            </form>
        </div>
        </header>
        <section>
            <ul class="taskChecklist" id="tasks" >
                <li class="task">Task 1 <input type="checkbox" class="tasksCheck"></li>
                <li class="task">Task 2<input type="checkbox"class="tasksCheck"></li>
                <li class="task">Task 3<input type="checkbox"class="tasksCheck"></li>
                <li class="task">Task 4<input type="checkbox"class="tasksCheck"></li>
            </ul>
        </section>
        <footer>
            <p>...by Damian</p>
        </footer>
    </div>
